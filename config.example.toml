# session-notes config. Copy to ~/.config/session-notes/config.toml
# (or point $SESSION_NOTES_CONFIG at it). Every key is optional; the values
# shown are the defaults. Relative paths resolve against this file's folder.
# Unknown keys are an error, so a typo fails loudly instead of being ignored.

[agent]
# Which agent these tools serve: "claude" or "codex". $SESSION_NOTES_AGENT overrides
# it per process; install.sh --codex sets that variable for Codex, so one config file
# serves both agents. The two keep separate memories: in codex mode every store and
# the state dir live under <codex_home>/session-notes/, the [paths] stores below and a
# scope's `store` are ignored, and a path under claude_home is refused.
kind = "claude"
codex_home = "~/.codex"
# Most characters the Codex SessionStart hook injects (index + RESUME files).
codex_boot_bytes = 12000

[paths]
# Claude Code's own directory (transcripts live under projects/).
claude_home = "~/.claude"
# Runtime state: bus mailbox, locks, audit logs, pane registry.
# Never memory content.
# The bus mailbox, bcast's log and pane state stay here in codex mode too, because
# every agent on the machine must share them; Codex memory and its other state move
# under codex_home.
state_dir = "~/.claude/session-notes/state"
# The global memory store. Empty = ~/.claude/projects/<your encoded home>/memory,
# the folder Claude Code already uses for sessions started in your home dir.
global_store = ""
# Where nightly_check.py records its last run (read by `nightly_check.py status`).
# Empty = <state_dir>/last-check.json, which stays put in codex mode so every agent
# reads the same file.
last_check = ""

[time]
# IANA zone for the clock anchor, e.g. "Europe/Berlin". Empty = system local.
timezone = ""
# After this many idle minutes, time_sense tells the model its context may be stale.
stale_after_minutes = 120

[bcast]
# Marker typed in front of broadcast prose so receivers know it was a broadcast.
prefix = "[user via bcast]"

[bus]
# tmux session name suggested in the "bus_nudge is down" restart hint.
nudge_session = "bus-nudge"

[handoff]
# A sentence handoff_session adds to the AUTO-START note for a session that builds
# something, e.g. "It runs under the normal gates (worktree -> PR -> review)."
# Empty = none. --no-build omits it.
build_note = ""

[budgets]
# Boot-prefix budgets, checked by boot_budget.py. Measured in characters,
# which is what the boot prefix counts.
global_index_bytes = 45000
scope_index_bytes = 30000
resume_bytes = 12000
claude_md_bytes = 20000
# Ceiling for a CLAUDE.md found outside every configured scope.
unlisted_claude_md_bytes = 40000
# Folders walked (depth 3) for CLAUDE.md files outside any scope.
sweep_roots = ["~/Projects"]

# A per-file budget that wins over the per-kind ones above. One block per file.
#
# [[budget_file]]
# path = "~/.claude/CLAUDE.md"
# bytes = 8000

[wt]
# bin/wt.py: a worktree per change, and a PR lifecycle gated on a review verdict.
# Shell command whose stdout is a GitHub token; wt exports it as GH_TOKEN for every gh call.
# A failing or empty command is an error, never a silent fallback.
token_command = "gh auth token"
# Global worktree root. Empty = the default rule (see docs/tools.md).
root = ""
# Repo root paths that are public: the pre-commit then also scans for the private terms.
public_repos = []
# The pre-commit refuses a staged file larger than this many KB.
size_cap_kb = 1024
# Private terms for public repos, in the format tests/leak_scan.py documents.
leak_terms = "~/.config/session-notes/leak-terms.txt"

# One block per project folder that keeps its own memory store.
# `store` is optional, and best left out: empty = the folder Claude Code
# already keeps for that project, named after its full path, e.g.
#   ~/.claude/projects/-Users-you-code-recipes-app/memory
# (unique, because the whole path is in the name).
#
# [[scopes]]
# name = "recipes-app"
# root = "~/code/recipes-app"
# store = ""
# # Optional: a file that describes the scope (routing notes for /reflect). The
# # canary treats it as part of the scope, not as a memory entry. Relative to root.
# manifest = ""
# # Optional: where wt.py puts this scope's worktrees (relative to root, or absolute).
# worktree_root = ""
