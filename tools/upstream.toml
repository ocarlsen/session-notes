# Which files in this repo came from an upstream Claude Code config (a ~/.claude kept in git),
# and where each one lives there. tools/upstream_drift.py reads this to report upstream
# changes that have not been ported yet. Paths only, relative to each repo's root.
#
# Every .py and SKILL.md under bin/, hooks/ and skills/ must appear exactly once, either as a
# [[pair]] or in repo_only; the drift check fails on an unmapped file so a new file is a
# decision, not an omission.

# bcast, bus_nudge, session_bus, reflect_lock and the bus hook are canonical HERE: an upstream config
# links to them instead of keeping its own copy, so there is nothing upstream to drift from.
repo_only = ["bin/append_memory_index.py", "bin/bcast.py", "bin/boot_budget.py", "bin/bus_nudge.py", "bin/codex_hooks.py", "bin/codex_save.py", "bin/environment_render.py", "bin/handoff_session.py", "bin/launch_agents.py", "bin/live.py", "bin/memory_hygiene_canary.py", "bin/memory_index_lint.py", "bin/nightly_check.py", "bin/notes_config.py", "bin/reflect_lock.py", "bin/review.py", "bin/rules_block.py", "bin/session_bus.py", "bin/session_lineage.py", "bin/session_peers.py", "bin/setup_claude.py", "bin/wt.py", "hooks/checkout_guard.py", "hooks/codex_session_start.py", "hooks/session_bus_hook.py", "hooks/session_pane_registry.py", "skills/codex/reflect/SKILL.md", "skills/codex/refresh/SKILL.md", "skills/codex/review/SKILL.md", "skills/codex/rnr/SKILL.md", "skills/review/SKILL.md"]

[[pair]]
repo = "bin/test_edit_check.py"
upstream = "bin/test_edit_guard.py"

[[pair]]
repo = "bin/skill_feedback.py"
upstream = "bin/skill_feedback.py"

[[pair]]
repo = "hooks/em_dash_guard.py"
upstream = "hooks/em_dash_guard.py"

[[pair]]
repo = "hooks/time_sense.py"
upstream = "hooks/time_sense.py"

[[pair]]
repo = "skills/find-session/SKILL.md"
upstream = "skills/find-session/SKILL.md"

[[pair]]
repo = "skills/find-session/find_session.py"
upstream = "skills/find-session/find_session.py"

[[pair]]
repo = "skills/reflect/SKILL.md"
upstream = "skills/reflect/SKILL.md"

[[pair]]
repo = "skills/refresh/SKILL.md"
upstream = "skills/refresh/SKILL.md"

[[pair]]
repo = "skills/rnr/SKILL.md"
upstream = "skills/rnr/SKILL.md"
