# Which files in this repo came from an upstream Claude Code config (a ~/.claude kept in git),
# and where each one lives there. tools/upstream_drift.py reads this to report upstream
# changes that have not been ported yet. Paths only, relative to each repo's root.
#
# Every .py and SKILL.md under bin/, hooks/ and skills/ must appear exactly once, either as a
# [[pair]] or in repo_only; the drift check fails on an unmapped file so a new file is a
# decision, not an omission.

repo_only = ["bin/notes_config.py", "bin/session_peers.py", "bin/setup_claude.py"]

[[pair]]
repo = "bin/append_memory_index.py"
upstream = "bin/append_memory_index.py"

[[pair]]
repo = "bin/bcast.py"
upstream = "bin/bcast.py"

[[pair]]
repo = "bin/boot_budget.py"
upstream = "bin/boot_budget.py"

[[pair]]
repo = "bin/bus_nudge.py"
upstream = "bin/bus_nudge.py"

[[pair]]
